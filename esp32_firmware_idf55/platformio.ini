; =====================================================================
; ai_music 完整固件 - IDF 5.5 稳定迁移环境
; VIEWE UEDX24320028E-WB-A / ESP32-S3-N16R8
; 独立使用 D:\platformio_diag，不影响旧版安全回退工程
; =====================================================================

[platformio]
default_envs = BOARD_VIEWE_UEDX24320028E_WB_A
core_dir = D:\platformio_diag

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_ldf_mode = chain
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#92b790ed6d24b0678e2f45b1fc85f0abd2d41b33
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#e79a63876a1d8a834cf8ec8f8b698ff9d9374579
    https://github.com/esp-arduino-libs/esp-lib-utils.git#bb9ea3d6d95d4f0ec9ebc9f65659a4b5d2977663
    tzapu/WiFiManager @ 2.0.17
    bblanchon/ArduinoJson @ 7.4.3
    earlephilhower/ESP8266Audio @ 1.9.9
    lvgl/lvgl @ 8.4.0

[common]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -I lib

[env:BOARD_VIEWE_UEDX24320028E_WB_A]
board = BOARD_VIEWE_UEDX24320028E_WB_A
board_build.flash_mode = qio
build_type = debug
build_flags =
    ${common.build_flags}
    -DLV_COLOR_16_SWAP=1
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_VIEWE_UEDX24320028E_WB_A
upload_speed = 921600
; 按本机串口修改，例如 COM8
upload_port = COM8
monitor_port = COM8
