; =====================================================================
; ai_music ESP32 固件 (VIEWE UEDX24320028E-WB-A, ESP32-S3-N16R8)
; 新板: 2.8" GC9307 SPI 屏 + CHSC6540 触摸; 驱动 ESP32_Display_Panel + LVGL v8.4
; 方案B混合: ESP32 只做 录音+上传+播放+触摸UI, 编排逻辑留在远程 Flask
; =====================================================================

[platformio]
default_envs = BOARD_VIEWE_UEDX24320028E_WB_A

[env]
framework = arduino
; 官方 espressif32 暂不支持 Arduino v3.1.x, 用 pioarduino 第三方平台
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.1.0

[common]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -I lib

[spi_qspi_lcd]
build_flags =
    -DLV_COLOR_16_SWAP=1

[env:BOARD_VIEWE_UEDX24320028E_WB_A]
build_flags =
    ${common.build_flags}
    ${spi_qspi_lcd.build_flags}
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_VIEWE_UEDX24320028E_WB_A
board = BOARD_VIEWE_UEDX24320028E_WB_A